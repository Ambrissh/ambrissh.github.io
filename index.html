0.5 font-sans font-normal text-[0.7rem] text-white/50 bg-white/[0.01]">open source</span><span class="rounded-full border border-white/12 px-2.5 py-0.5 font-sans font-normal text-[0.7rem] text-white/50 bg-white/[0.01]">chrome extension</span><span class="rounded-full border border-white/12 px-2.5 py-0.5 font-sans font-normal text-[0.7rem] text-white/50 bg-white/[0.01]">groq api</span></div><p class="font-sans text-[0.875rem] font-light leading-[1.7] text-white/60 mt-3">AI-powered Chrome extension that filters Discord noise using Groq API. Sends browser notifications only for messages that actually matter. Because who has time to read 400 unread messages.</p><a href="https://github.com/Ambrissh/loopthru" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 font-sans font-normal text-[0.8rem] text-white/38 mt-4.5 decoration-none transition-colors duration-200 hover:text-white/80"><span>View on GitHub</span><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-external-link w-3 h-3" aria-hidden="true"><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg></a></div></article><article class="reveal-project group flex flex-row items-start gap-6 rounded-[1.25rem] p-6 bg-white/[0.04] border border-white/[0.09] mb-5 transition-all duration-200 ease-in-out hover:-translate-y-[3px] hover:border-white/18"><div class="flex-shrink-0 w-14 h-14 rounded-[0.75rem] overflow-hidden bg-black/40 flex items-center justify-center"><img src="/clowde.png" alt="Clowde Logo" class="w-14 h-14 object-contain" loading="lazy" decoding="async"/></div><div class="flex-1"><div class="flex justify-between items-start"><h3 class="font-sans text-[1rem] font-semibold text-white leading-tight">Clowde</h3><span class="font-sans text-[0.8rem] font-light
